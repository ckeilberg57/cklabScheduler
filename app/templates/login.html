<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — {{ app_display_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body class="login-page">
  <div class="login-shell">
    <div class="login-box glass">

      <div class="login-header">
        <div class="brand-mark">C</div>
        <div>
          <div class="eyebrow">Whiteglove Operations</div>
          <h1>{{ app_display_name }}</h1>
        </div>
      </div>

      <h2 class="login-title">Sign in</h2>

      {% if error %}
      <div class="login-error" role="alert">{{ error }}</div>
      {% endif %}

      {% if local_auth_enabled %}
      <form method="post" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <label>
          Username
          <input type="text" name="username" value="{{ prefill_username }}" required autofocus autocomplete="username" />
        </label>

        <label>
          Password
          <input type="password" name="password" required autocomplete="current-password" />
        </label>

        <button type="submit" class="primary wide">Sign in</button>
      </form>
      {% endif %}

      {% if local_auth_enabled and entra_auth_enabled %}
      <div class="auth-divider"><span>or</span></div>
      {% endif %}

      {% if entra_auth_enabled %}
      <a href="{{ url_for('auth.entra_login') }}" class="btn-microsoft">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 23 23">
          <path fill="#f35325" d="M1 1h10v10H1z"/>
          <path fill="#81bc06" d="M12 1h10v10H12z"/>
          <path fill="#05a6f0" d="M1 12h10v10H1z"/>
          <path fill="#ffba08" d="M12 12h10v10H12z"/>
        </svg>
        Sign in with Microsoft
      </a>
      {% endif %}

    </div>
  </div>
</body>
</html>
