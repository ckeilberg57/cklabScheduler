# /etc/apache2/sites-available/sbalkcscheduler.conf
#
# Template — deploy/install.sh substitutes SERVER_HOSTNAME, URL_PREFIX, and TLS
# paths and writes the real file to /etc/apache2/sites-available/.
# Do not use this file directly; the actual config is generated by install.sh.
#
# URL_PREFIX is set interactively during install (default: /sbalkcScheduler).
# Replace YOUR_URL_PREFIX below with the chosen path to use as a manual reference.
#
# Required Apache modules: proxy proxy_http ssl headers
# Enable with: a2enmod proxy proxy_http ssl headers

# HTTP → HTTPS redirect
<VirtualHost *:80>
    ServerName YOUR_SERVER_HOSTNAME
    Redirect permanent / https://YOUR_SERVER_HOSTNAME/
</VirtualHost>

<VirtualHost *:443>
    ServerName YOUR_SERVER_HOSTNAME

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/sbalkcscheduler.crt
    SSLCertificateKeyFile /etc/ssl/private/sbalkcscheduler.key

    # Exact redirect: /YOUR_URL_PREFIX (no trailing slash) -> /YOUR_URL_PREFIX/
    # The anchored regex ensures /YOUR_URL_PREFIX/anything is NOT affected.
    RedirectMatch permanent ^/YOUR_URL_PREFIX$ /YOUR_URL_PREFIX/

    # Reverse proxy to Gunicorn.  The /YOUR_URL_PREFIX/ prefix is preserved on
    # both sides so Gunicorn's SCRIPT_NAME processing can split the path correctly.
    #
    # Request flow:
    #   Browser   GET /YOUR_URL_PREFIX/api/health
    #   Apache    forwards /YOUR_URL_PREFIX/api/health to http://127.0.0.1:5080/YOUR_URL_PREFIX/api/health
    #   Gunicorn  SCRIPT_NAME=/YOUR_URL_PREFIX → strips prefix → PATH_INFO=/api/health
    #   Flask     routes /api/health; request.script_root=/YOUR_URL_PREFIX
    #
    # DO NOT change this to http://127.0.0.1:5080/ — that strips the prefix and
    # causes Gunicorn IndexError in http/wsgi.py.
    ProxyPreserveHost On
    ProxyPass        /YOUR_URL_PREFIX/ http://127.0.0.1:5080/YOUR_URL_PREFIX/
    ProxyPassReverse /YOUR_URL_PREFIX/ http://127.0.0.1:5080/YOUR_URL_PREFIX/

    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog  ${APACHE_LOG_DIR}/sbalkcscheduler_error.log
    CustomLog ${APACHE_LOG_DIR}/sbalkcscheduler_access.log combined
</VirtualHost>
